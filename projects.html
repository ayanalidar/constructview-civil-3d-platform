<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — ConstructView</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 40 40" fill="none">
            <rect x="2" y="20" width="8" height="18" rx="1" fill="currentColor"/>
            <rect x="13" y="10" width="8" height="28" rx="1" fill="currentColor"/>
            <rect x="24" y="14" width="8" height="24" rx="1" fill="currentColor" opacity="0.6"/>
            <rect x="2" y="16" width="30" height="3" rx="1" fill="var(--color-accent)"/>
          </svg>
        </div>
        <span class="brand-name" id="brandName">ConstructView</span>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-grid-2"></i><span>Dashboard</span></a>
        <a href="projects.html" class="nav-item active"><i class="fa-solid fa-folder-tree"></i><span>Projects</span></a>
        <a href="viewer.html" class="nav-item"><i class="fa-solid fa-cube"></i><span>3D Viewer</span></a>
        <a href="tasks.html" class="nav-item"><i class="fa-solid fa-list-check"></i><span>Tasks</span></a>
        <a href="team.html" class="nav-item"><i class="fa-solid fa-users"></i><span>Team</span></a>
        <a href="settings.html" class="nav-item"><i class="fa-solid fa-sliders"></i><span>Settings</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-badge">
          <div class="avatar">AJ</div>
          <div class="user-info">
            <span class="user-name">Alex Johnson</span>
            <span class="user-role">Project Manager</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn-icon" id="sidebarToggle" aria-label="Toggle sidebar"><i class="fa-solid fa-bars"></i></button>
          <div class="breadcrumb"><span>Projects</span> / <span>All</span></div>
        </div>
        <div class="topbar-right">
          <button class="btn-icon has-badge"><i class="fa-solid fa-bell"></i><span class="badge">3</span></button>
          <button class="btn btn-accent btn-sm"><i class="fa-solid fa-plus"></i> New Project</button>
        </div>
      </header>

      <div class="page-content">
        <div class="page-header">
          <div>
            <h1>All Projects</h1>
            <p class="text-muted">6 projects across 5 categories</p>
          </div>
        </div>

        <div class="filter-bar">
          <div class="search-input" id="projectSearch">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search projects, clients, locations...">
            <span style="font-size:0.7rem;color:var(--color-text-muted);border:1px solid var(--color-border);padding:1px 6px;border-radius:4px;">/</span>
          </div>
          <div class="filter-chips">
            <button class="chip active" data-filter="all">All</button>
            <button class="chip" data-filter="residential"><i class="fa-solid fa-house"></i> Residential</button>
            <button class="chip" data-filter="infrastructure"><i class="fa-solid fa-road"></i> Infrastructure</button>
            <button class="chip" data-filter="healthcare"><i class="fa-solid fa-hospital"></i> Healthcare</button>
            <button class="chip" data-filter="commercial"><i class="fa-solid fa-building"></i> Commercial</button>
            <button class="chip" data-filter="industrial"><i class="fa-solid fa-industry"></i> Industrial</button>
          </div>
        </div>

        <div class="project-grid" id="projectsGrid">
          <!-- Rendered by JS -->
        </div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
